# Builds wirefork for Linux (x64), Windows (x64) and macOS (universal: arm64 +
# x86_64), checks that each binary starts on its own system, and pushes the
# binaries, logs and STATUS.md to the branch ci-builds (one commit, replaced on
# every run). Same layout as mega-fork/ultra's build.
name: wirefork

on:
  push:
    branches: [m3]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: wirefork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p out/logs
          go test ./ ./netstack 2>&1 | tee out/logs/test.log
      - name: Cross-compile (vendor/ holds the patched gVisor)
        run: |
          set -o pipefail
          build() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -mod=vendor -trimpath -ldflags "-s -w" -o "out/$3" ./cmd/wireproxy; }
          { build linux amd64 wirefork-linux-x64
            build windows amd64 wirefork-win-x64.exe
            build darwin amd64 wirefork-mac-x64
            build darwin arm64 wirefork-mac-arm64; } 2>&1 | tee out/logs/build.log
          ./out/wirefork-linux-x64 --version | tee out/logs/smoke-linux.log
      - name: macOS universal binary (llvm-lipo, so publishing doesn't wait for a macOS runner)
        run: |
          set -o pipefail
          LIPO=$(command -v llvm-lipo || ls /usr/bin/llvm-lipo-* 2>/dev/null | sort -V | tail -1)
          if [ -z "$LIPO" ]; then sudo apt-get install -y llvm >/dev/null; LIPO=$(command -v llvm-lipo || ls /usr/bin/llvm-lipo-* | sort -V | tail -1); fi
          "$LIPO" -create -output out/wirefork-mac-universal out/wirefork-mac-x64 out/wirefork-mac-arm64
          chmod +x out/wirefork-mac-universal
          "$LIPO" -info out/wirefork-mac-universal 2>&1 | tee out/logs/lipo.log
          cp LICENSE out/LICENSE-wireproxy.txt
          cp netstack/LICENSE-wireguard-go out/LICENSE-wireguard-go.txt
          cp vendor/gvisor.dev/gvisor/LICENSE out/LICENSE-gvisor.txt
          cp WIREFORK.md out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: out
          if-no-files-found: ignore

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out
      - name: Start test
        run: |
          set -o pipefail
          mkdir -p win
          ./out/wirefork-win-x64.exe --version 2>&1 | tee win/smoke-windows.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: win

  mac:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out
      - name: Start test of the universal binary
        run: |
          set -o pipefail
          mkdir -p mac
          chmod +x out/wirefork-mac-universal
          lipo -info out/wirefork-mac-universal | tee mac/smoke-mac.log
          ./out/wirefork-mac-universal --version 2>&1 | tee -a mac/smoke-mac.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac
          path: mac

  publish:
    needs: [build, windows, mac]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Push binaries and logs to the ci-builds branch
        run: |
          mkdir -p out/logs
          cp art/build/wirefork-linux-x64 art/build/wirefork-win-x64.exe out/ 2>/dev/null || true
          cp art/build/LICENSE-* art/build/WIREFORK.md out/ 2>/dev/null || true
          cp art/build/wirefork-mac-universal out/ 2>/dev/null || true
          cp art/build/logs/* art/windows/* art/mac/smoke-mac.log out/logs/ 2>/dev/null || true
          cd out
          {
            echo "# wirefork build ${{ github.sha }}"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "- build (tests, linux, cross-compile): ${{ needs.build.result }}"
            echo "- windows start test: ${{ needs.windows.result }}"
            echo "- mac start test (universal binary is built by the build job): ${{ needs.mac.result }}"
            echo
          } > STATUS.md
          find . -type f ! -name STATUS.md | sort >> STATUS.md
          git init -q -b ci-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "wirefork build ${{ github.sha }} (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-builds
